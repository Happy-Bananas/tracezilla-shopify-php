services:
  integration:
    build: .
    working_dir: /app
    user: "${TRACEZILLA_DOCKER_UID:-1000}:${TRACEZILLA_DOCKER_GID:-1000}"
    init: true
    volumes:
      - .:/app
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tracezilla-integration-ready"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 30s
